name: Release

# Push a tag such as v0.1.0 (see AGENTS.md, "Release"). The workflow builds the card and attaches
# ha-energy-widget.js to the GitHub release, which is what HACS downloads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} != package.json v${version}"; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ha-energy-widget.js --clobber
          else
            gh release create "$TAG" dist/ha-energy-widget.js --title "$TAG" --generate-notes
          fi
